<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CFN Expiry Search</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --ink:#1c2230; --muted:#6b7385; --line:#e3e6ec;
    --accent:#1f5eff; --accent-ink:#fff;
    --red:#c62828; --red-bg:#fdecec; --amber:#a15c00; --amber-bg:#fff4e0; --ok:#1b7a43;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#14171d; --card:#1d222b; --ink:#e8ebf1; --muted:#97a0b3; --line:#2c333f;
      --accent:#5b8cff; --accent-ink:#0c1020; --red:#ff7b7b; --red-bg:#3a1f22; --amber:#ffb454; --amber-bg:#3a2d17; --ok:#58c88a; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai",sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:14px 10px 80px}
  h1{font-size:18px;margin:4px 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px}
  .drop{padding:26px 16px;text-align:center;border:2px dashed var(--line);border-radius:12px;background:var(--card);cursor:pointer}
  .drop.over{border-color:var(--accent)}
  .drop b{display:block;margin-bottom:4px}
  .drop span{color:var(--muted);font-size:13px}
  .btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn:active{transform:scale(.97)}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
  .search{display:flex;gap:8px}
  .search input{flex:1;min-width:0;padding:10px 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  .search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;color:var(--muted);font-size:13px;flex-wrap:wrap}
  .chk{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:14px;cursor:pointer}
  .chk input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
  .meta{row-gap:6px;column-gap:14px}
  .chk.off{opacity:.45}
  tr.grp{cursor:pointer}
  tr.grp td:last-child{text-align:right;color:var(--muted);font-size:13px}
  tr.grp .n{color:var(--muted);font-size:12px}
  tr.det td{background:color-mix(in srgb,var(--line) 35%,transparent)}
  tr.det td:first-child{padding-left:22px}
  .meta select{font:inherit;font-size:13px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}
  th{padding:8px 4px}
  td:first-child,th:first-child{padding-left:8px}
  td:last-child,th:last-child{padding-right:6px}
  .tw{overflow:hidden}
  tr:last-child td{border-bottom:0}
  .cfn{font-weight:600}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:-.2px}
  .exp{white-space:nowrap;font-size:12.5px}
    .exp small{display:block;font-size:11px;line-height:1.2;color:var(--muted)}
  .exp.expired{color:var(--red)} .exp.expired small{color:var(--red)}
  .exp.soon{color:var(--amber)} .exp.soon small{color:var(--amber)}
  tr.expired td:first-child{box-shadow:inset 3px 0 var(--red)}
  tr.soon td:first-child{box-shadow:inset 3px 0 var(--amber)}
  .cp{padding:5px 8px;font-size:12px;white-space:nowrap}
  .cp.done{background:var(--ok);border-color:var(--ok);color:#fff}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  .err{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--red-bg);color:var(--red);font-size:14px}
  .more{display:block;margin:12px auto 0}
  .legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin:2px 0 10px;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
  #toast.show{opacity:.95}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>CFN Expiry Search</h1>

  <div id="dropzone" class="drop" tabindex="0" role="button">
    <b>Choose an Excel file (.xlsx)</b>
    <span>Tap to select, or drop a file here · The file is read on your device and never uploaded</span>
    <input id="file" type="file" accept=".xlsx,.xlsm" hidden>
  </div>
  <div id="error" class="err" hidden></div>

  <div id="app" hidden>
    <div class="bar">
      <div class="search">
        <input id="q" type="search" placeholder="Search CFN, e.g. W3DR01" autocomplete="off" autocapitalize="characters" spellcheck="false">
        <button id="reload" class="btn" type="button">Change file</button>
      </div>
      <div class="meta">
        <span id="count"></span>
        <label class="chk" id="hideLbl"><input id="hideExp" type="checkbox"> Hide expired</label>
        <label class="chk"><input id="nearExp" type="checkbox"> Near expiry (90 days)</label>
      </div>
    </div>
    <div class="legend">
      <span><i style="background:var(--red)"></i>Expired</span>
      <span><i style="background:var(--amber)"></i>Expires within 90 days</span>
      <span id="fileinfo"></span>
    </div>
    <div class="card tw">
      <table>
        <thead><tr><th>CFN</th><th id="th2">Batch</th><th>Exp</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>No items found</div>
    </div>
    <button id="more" class="btn more" type="button" hidden></button>
  </div>
</div>
<div id="toast"></div>

<script>
/* ---------- xlsx reader (no external library) ---------- */
async function inflateRaw(bytes){
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--){
    if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if (eocd < 0) throw new Error('Not a valid .xlsx file');
  const n = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder(), files = {};
  for (let i = 0; i < n; i++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
    const off = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    files[name] = {method, csize, off};
    p += 46 + nl + el + cl;
  }
  return {
    async text(name){
      const f = files[name]; if (!f) return null;
      const ln = dv.getUint16(f.off + 26, true), le = dv.getUint16(f.off + 28, true);
      const start = f.off + 30 + ln + le;
      const raw = u8.subarray(start, start + f.csize);
      const out = f.method === 0 ? raw : await inflateRaw(raw);
      return dec.decode(out);
    },
    has(name){ return !!files[name]; }
  };
}
const unesc = s => s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
  .replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(+d)).replace(/&#x([0-9a-f]+);/gi,(_,h)=>String.fromCodePoint(parseInt(h,16))).replace(/&amp;/g,'&');
function textOf(xml){
  xml = xml.replace(/<rPh\b[\s\S]*?<\/rPh>/g,'');
  let s = '', m; const re = /<t\b[^>]*>([\s\S]*?)<\/t>/g;
  while ((m = re.exec(xml))) s += m[1];
  return unesc(s);
}
function colIndex(letters){ let n = 0; for (const c of letters) n = n * 26 + c.charCodeAt(0) - 64; return n - 1; }

async function readSheets(buf){
  const z = await unzip(buf);
  const wb = await z.text('xl/workbook.xml');
  if (!wb) throw new Error('No workbook data found in the file');
  const rels = (await z.text('xl/_rels/workbook.xml.rels')) || '';
  const relMap = {};
  for (const m of rels.matchAll(/<Relationship\b[^>]*>/g)){
    const id = /\bId="([^"]*)"/.exec(m[0]), tg = /\bTarget="([^"]*)"/.exec(m[0]);
    if (id && tg) relMap[id[1]] = tg[1];
  }
  const sheets = [];
  for (const m of wb.matchAll(/<sheet\b[^>]*>/g)){
    const name = /\bname="([^"]*)"/.exec(m[0]), rid = /\br:id="([^"]*)"/.exec(m[0]);
    if (!name || !rid || !relMap[rid[1]]) continue;
    let t = relMap[rid[1]];
    t = t.startsWith('/') ? t.slice(1) : 'xl/' + t;
    sheets.push({name: unesc(name[1]), path: t});
  }
  const sst = [];
  const ss = await z.text('xl/sharedStrings.xml');
  if (ss) for (const m of ss.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)) sst.push(textOf(m[1]));
  return {z, sheets, sst};
}
async function sheetRows(z, path, sst, maxRows){
  const xml = await z.text(path); if (!xml) return [];
  const rows = [];
  const rowRe = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;
  let rm;
  while ((rm = rowRe.exec(xml))){
    const rn = /\br="(\d+)"/.exec(rm[1]);
    const rowNum = rn ? +rn[1] : rows.length + 1;
    const cells = [];
    if (rm[2]){
      const cRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let cm;
      while ((cm = cRe.exec(rm[2]))){
        const at = cm[1];
        const r = /\br="([A-Z]+)\d+"/.exec(at); if (!r) continue;
        const t = (/\bt="([^"]*)"/.exec(at) || [])[1];
        const body = cm[2] || '';
        let val = null;
        if (t === 'inlineStr') val = textOf(body);
        else {
          const v = /<v>([\s\S]*?)<\/v>/.exec(body);
          if (v){
            if (t === 's') val = sst[+v[1]];
            else if (t === 'str' || t === 'e') val = unesc(v[1]);
            else if (t === 'b') val = v[1] === '1';
            else val = parseFloat(v[1]);
          }
        }
        cells[colIndex(r[1])] = val;
      }
    }
    rows[rowNum - 1] = cells;
    if (maxRows && rowNum >= maxRows) break;
  }
  return rows;
}

/* ---------- find CFN / Batch / Exp ---------- */
const norm = v => (v == null ? '' : String(v)).replace(/\s+/g,' ').trim();
function toDate(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number'){
    if (v < 1) return null;
    return new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000);
  }
  const s = String(v).trim();
  let m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s);
  if (m) return new Date(Date.UTC(+m[1], +m[2]-1, +m[3]));
  m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/.exec(s);
  if (m) return new Date(Date.UTC(+m[3], +m[2]-1, +m[1]));
  return null;
}
function findColumns(hdr){
  const h = hdr.map(norm);
  const cfn = h.findIndex(x => /^cfn$/i.test(x));
  let batch = h.findIndex(x => /^batch no\.?$/i.test(x));
  if (batch < 0) batch = h.findIndex(x => /batch/i.test(x) && !/real|expir/i.test(x));
  let exp = h.findIndex(x => /expiry/i.test(x) && !/days|expired/i.test(x));
  if (exp < 0) exp = h.findIndex(x => /^exp/i.test(x) && !/days|expired/i.test(x));
  return {cfn, batch, exp};
}
async function extract(buf){
  const {z, sheets, sst} = await readSheets(buf);
  for (const sh of sheets){
    const rows = await sheetRows(z, sh.path, sst);
    for (let i = 0; i < Math.min(rows.length, 30); i++){
      if (!rows[i]) continue;
      const c = findColumns(Array.from(rows[i], x => x));
      if (c.cfn >= 0 && c.batch >= 0 && c.exp >= 0){
        const seen = new Set(), out = [];
        let raw = 0;
        for (let r = i + 1; r < rows.length; r++){
          const row = rows[r]; if (!row) continue;
          const cfn = norm(row[c.cfn]); if (!cfn) continue;
          raw++;
          const batch = norm(row[c.batch]);
          const d = toDate(row[c.exp]);
          const key = cfn + '|' + batch + '|' + (d ? +d : '');
          if (seen.has(key)) continue;
          seen.add(key);
          out.push({cfn, batch, exp: d ? +d : null});
        }
        out.sort((a, b) => (a.exp ?? Infinity) - (b.exp ?? Infinity) || a.cfn.localeCompare(b.cfn));
        return {sheet: sh.name, rows: out, raw};
      }
    }
  }
  throw new Error('Could not find the CFN, Batch No. and Batch Expiry Date columns in this file');
}

/* ---------- UI ---------- */
if (typeof document !== 'undefined'){
const $ = id => document.getElementById(id);
const PAGE = 300;
let data = [], shown = PAGE, filtered = [];
const todayUTC = (()=>{ const n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()); })();

function fmt(ms){
  const d = new Date(ms);
  return String(d.getUTCDate()).padStart(2,'0') + '/' + String(d.getUTCMonth()+1).padStart(2,'0') + '/' + d.getUTCFullYear();
}
function expInfo(ms){
  if (ms == null) return {cls:'', text:'-', sub:''};
  const days = Math.round((ms - todayUTC) / 86400000);
  const far = new Date(ms).getUTCFullYear() >= 2099;
  const n = Math.abs(days).toLocaleString();
  if (days < 0) return {cls:'expired', text:fmt(ms), sub:'(' + n + (days === -1 ? ' day ago)' : ' days ago)')};
  if (days === 0) return {cls:'soon', text:fmt(ms), sub:'(expires today)'};
  if (days <= 90) return {cls:'soon', text:fmt(ms), sub:'(' + n + (days === 1 ? ' day left)' : ' days left)')};
  return {cls:'', text:fmt(ms), sub: far ? '' : '(' + n + ' days left)'};
}
const squash = s => s.toUpperCase().replace(/[\s\-_.\/]/g,'');

const NEAR_DAYS = 90;
let refs = [];
function expCell(td, e){
  td.className = 'exp' + (e.cls ? ' ' + e.cls : '');
  td.textContent = e.text;
  if (e.sub){ const sm = document.createElement('small'); sm.textContent = e.sub; td.append(sm); }
}
function copyBtn(i){
  const td = document.createElement('td'); td.style.textAlign = 'right';
  const b = document.createElement('button'); b.type = 'button'; b.className = 'btn cp'; b.textContent = 'Copy'; b.dataset.i = i;
  td.append(b); return td;
}
function render(){
  const q = squash($('q').value);
  const near = $('nearExp').checked;
  const hide = !near && $('hideExp').checked;
  $('hideExp').disabled = near; $('hideLbl').classList.toggle('off', near);
  $('th2').textContent = near ? 'Batches' : 'Batch';
  const nearMax = todayUTC + NEAR_DAYS * 86400000;
  filtered = data.filter(r =>
    (!near || (r.exp != null && r.exp >= todayUTC && r.exp <= nearMax)) &&
    (!hide || r.exp == null || r.exp >= todayUTC) &&
    (!q || squash(r.cfn).includes(q) || squash(r.batch).includes(q)));
  const body = $('rows'); body.textContent = '';
  const frag = document.createDocumentFragment();
  refs = [];
  let total, rest;
  if (!near){
    filtered.slice(0, shown).forEach(r => {
      const e = expInfo(r.exp);
      const tr = document.createElement('tr');
      if (e.cls) tr.className = e.cls;
      const a = document.createElement('td'); a.className = 'cfn mono'; a.textContent = r.cfn;
      const b = document.createElement('td'); b.className = 'mono'; b.textContent = r.batch;
      const c = document.createElement('td'); expCell(c, e);
      refs.push(r);
      tr.append(a, b, c, copyBtn(refs.length - 1));
      frag.append(tr);
    });
    total = filtered.length;
    rest = filtered.length - shown;
    $('count').textContent = total.toLocaleString() + ' items' + (q || hide ? ' (of ' + data.length.toLocaleString() + ')' : '');
  } else {
    const groups = new Map();
    filtered.forEach(r => { if (!groups.has(r.cfn)) groups.set(r.cfn, []); groups.get(r.cfn).push(r); });
    const list = [...groups.entries()];
    list.slice(0, shown).forEach(([cfn, items]) => {
      const e = expInfo(items[0].exp);
      const tr = document.createElement('tr'); tr.className = 'grp soon'; tr.dataset.g = cfn;
      const a = document.createElement('td'); a.className = 'cfn mono'; a.textContent = cfn;
      const b = document.createElement('td'); b.className = 'n'; b.textContent = items.length + (items.length === 1 ? ' batch' : ' batches');
      const c = document.createElement('td'); expCell(c, e);
      const d = document.createElement('td'); d.textContent = '▸';
      tr.append(a, b, c, d); frag.append(tr);
      items.forEach(r => {
        const e2 = expInfo(r.exp);
        const dr = document.createElement('tr'); dr.className = 'det'; dr.hidden = true;
        const x = document.createElement('td'); x.colSpan = 2; x.className = 'mono'; x.textContent = r.batch;
        const y = document.createElement('td'); expCell(y, e2);
        refs.push(r);
        dr.append(x, y, copyBtn(refs.length - 1)); frag.append(dr);
      });
    });
    total = list.length;
    rest = list.length - shown;
    $('count').textContent = total.toLocaleString() + ' CFN · ' + filtered.length.toLocaleString() + (filtered.length === 1 ? ' batch' : ' batches') + ' near expiry';
  }
  body.append(frag);
  $('empty').hidden = total > 0;
  $('more').hidden = rest <= 0;
  if (rest > 0) $('more').textContent = 'Show more (' + rest.toLocaleString() + ' left)';
}

let toastT;
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1800);
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.append(ta); ta.focus(); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch(e){ return false; }
}
$('rows').addEventListener('click', async ev => {
  const g = ev.target.closest('tr.grp');
  if (g && !ev.target.closest('.cp')){
    let n = g.nextElementSibling, open = null;
    while (n && n.classList.contains('det')){ if (open === null) open = n.hidden; n.hidden = !open; n = n.nextElementSibling; }
    g.lastElementChild.textContent = open ? '▾' : '▸';
    return;
  }
  const b = ev.target.closest('.cp'); if (!b) return;
  const r = refs[+b.dataset.i]; if (!r) return;
  const text = r.cfn + ' Batch: ' + r.batch;
  if (await copyText(text)){
    b.classList.add('done'); b.textContent = '✓ Copied';
    setTimeout(() => { b.classList.remove('done'); b.textContent = 'Copy'; }, 1200);
    toast('Copied: ' + text);
  } else toast('Copy failed. Long-press the text to copy it manually.');
});
$('hideExp').onchange = () => { shown = PAGE; render(); };
$('nearExp').onchange = () => { shown = PAGE; render(); };
$('more').onclick = () => { shown += PAGE; render(); };
let qT; $('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { shown = PAGE; render(); }, 120); });

async function load(file){
  $('error').hidden = true;
  try {
    const res = await extract(await file.arrayBuffer());
    data = res.rows; shown = PAGE; $('q').value = '';
    $('fileinfo').textContent = file.name + ' · Sheet: ' + res.sheet;
    $('dropzone').hidden = true; $('app').hidden = false;
    render(); $('q').focus();
  } catch(e){
    $('error').textContent = 'Could not read the file: ' + (e.message || e); $('error').hidden = false;
  }
}
const pick = () => $('file').click();
$('dropzone').onclick = pick;
$('dropzone').onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') pick(); };
$('reload').onclick = () => { $('file').value = ''; pick(); };
$('file').onchange = e => { if (e.target.files[0]) load(e.target.files[0]); };
['dragover','dragenter'].forEach(n => document.addEventListener(n, e => { e.preventDefault(); $('dropzone').classList.add('over'); }));
['dragleave','drop'].forEach(n => document.addEventListener(n, e => { e.preventDefault(); $('dropzone').classList.remove('over'); }));
document.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) load(f); });
}
</script>
</body>
</html>
